services:
  - type: web
    name: amway-champion
    runtime: node
    plan: free
    region: singapore
    buildCommand: >
      npm install --prefix client &&
      npm run build --prefix client &&
      npm install --prefix server &&
      npm run build --prefix server
    startCommand: npm run start:prod --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SESSION_SECRET
        generateValue: true
